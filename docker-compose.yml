services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./auth_info:/app/auth_info
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/todo_bot}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OWNER_NUMBER=${OWNER_NUMBER}
      - TIMEZONE=${TIMEZONE:-Asia/Jakarta}
      - DEFAULT_REMINDER_LEAD_MINUTES=${DEFAULT_REMINDER_LEAD_MINUTES:-10}
      - REMINDER_PACING_MIN_MS=${REMINDER_PACING_MIN_MS:-20000}
      - REMINDER_PACING_MAX_MS=${REMINDER_PACING_MAX_MS:-30000}
      - ANTIGRAVITY_BRIDGE_URL=${ANTIGRAVITY_BRIDGE_URL:-http://host.docker.internal:7860}
      - ANTIGRAVITY_BRIDGE_TOKEN=${ANTIGRAVITY_BRIDGE_TOKEN:-}
      - AUTH_DIR=/app/auth_info
      - DASHBOARD_ENABLED=${DASHBOARD_ENABLED:-false}
      - DASHBOARD_HOST=${DASHBOARD_HOST:-0.0.0.0}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-3080}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - TELEMETRY_FLUSH_INTERVAL_MS=${TELEMETRY_FLUSH_INTERVAL_MS:-60000}
      - LINK_CHECK_ENABLED=${LINK_CHECK_ENABLED:-false}
      - LINK_INSPECTOR_URL=${LINK_INSPECTOR_URL:-http://link-inspector:7870}
      - LINK_INSPECTOR_TOKEN=${LINK_INSPECTOR_TOKEN:-}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY:-}
    ports:
      - "${DASHBOARD_PORT:-3080}:${DASHBOARD_PORT:-3080}"
    # When running alongside existing host postgres or host antigravity bridge:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Opens links from messages in an isolated headless Chromium (LINK_CHECK_ENABLED=true).
  # Start with: docker compose --profile link-check up -d
  # No published ports: only the bot reaches it over the compose network.
  link-inspector:
    profiles: ["link-check"]
    build:
      context: .
      dockerfile: Dockerfile.link-inspector
    restart: unless-stopped
    environment:
      - LINK_INSPECTOR_TOKEN=${LINK_INSPECTOR_TOKEN:-}
      - LINK_CHECK_PROXY_URL=${LINK_CHECK_PROXY_URL:-}
      - INSPECTOR_MAX_CONCURRENT=${INSPECTOR_MAX_CONCURRENT:-2}
      - INSPECTOR_DNS=${INSPECTOR_DNS:-system}
      - INSPECTOR_DOH_URL=${INSPECTOR_DOH_URL:-}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 512m
    mem_limit: 1g
    pids_limit: 512

  # Optional local postgres service if user wants standalone compose:

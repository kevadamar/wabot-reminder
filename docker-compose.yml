services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./auth_info:/app/auth_info
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/todo_bot}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OWNER_NUMBER=${OWNER_NUMBER}
      - TIMEZONE=${TIMEZONE:-Asia/Jakarta}
      - DEFAULT_REMINDER_LEAD_MINUTES=${DEFAULT_REMINDER_LEAD_MINUTES:-30}
      - AUTH_DIR=/app/auth_info
    # When running alongside existing host postgres:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional local postgres service if user wants standalone compose:
